name: Release

# Publishes every pak in one zip, as a release named MAJOR.MINOR.N. MAJOR.MINOR
# comes from the VERSION file, which only a maintainer changes (for example to
# 1.0); this workflow never edits it. N counts up from 0 for each MAJOR.MINOR.

on:
  push:
    branches: [main]
    paths: ['*.pak']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check-paks.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick the release name
        id: name
        run: |
          series=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$series" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR, such as 0.9; got '$series'"
            exit 1
          fi
          last=$(git ls-remote --tags --refs origin "refs/tags/$series.*" \
            | sed 's|.*refs/tags/||' \
            | grep -E "^${series//./\\.}\.[0-9]+$" \
            | sed "s|^$series\.||" | sort -n | tail -1)
          tag="$series.$(( ${last:--1} + 1 ))"
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Zip the paks
        run: zip -X -9 "zerospades-paks-${{ steps.name.outputs.tag }}.zip" *.pak

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          {
            echo "Official ZeroSpades mod paks, version $TAG."
            echo
            echo "Unzip into your \`Mods/\` folder, or use \"Download official mods...\" in game."
            echo
            echo "| Pak | Size |"
            echo "| --- | ---: |"
            for p in *.pak; do
              printf '| `%s` | %s KB |\n' "$p" "$(( $(stat -c %s "$p") / 1024 ))"
            done
          } > notes.md
          gh release create "$TAG" "zerospades-paks-$TAG.zip" \
            --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
